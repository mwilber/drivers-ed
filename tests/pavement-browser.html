<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Road surface review</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9ede6; color: #273b35; font: 15px system-ui; }
  header { padding: 18px 28px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
  h1 { font-size: 22px; margin: 0; } p { margin: 4px 0; }
  label { display: flex; align-items: center; gap: 6px; }
  select, button { font: inherit; padding: 7px 10px; }
  canvas { display: block; width: 100%; height: 65vh; }
  footer { padding: 16px 28px; }
</style>
<header>
  <div><h1>Road surfaces</h1><p>Production pavement · drag to orbit, scroll to zoom.</p></div>
  <label>Location <select id="location"><option value="crossing">Town crossing</option><option value="driveway">House driveway</option><option value="lot">Practice lot</option><option value="mews">Mews exit</option></select></label>
  <label>Surface <select id="weather"><option value="dry">Dry</option><option value="rain">Wet</option></select></label>
  <label>Detail <select id="detail"><option value="near">Near joints</option><option value="far">Distant pavement</option></select></label>
  <button id="check">Run visual checks</button>
</header>
<canvas id="review" aria-label="Orbit view of concrete joints, curb openings and painted road markings"></canvas>
<footer><p id="status" role="status">Ready</p><p id="resources"></p><p>All pavement, curb gaps and paint persist at distance. Only fine concrete joints disappear.</p><p><a href="/">Open free driving</a></p></footer>
<script type="module" src="./pavement-browser.mjs"></script>
</html>
