<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neighborhood scenery review</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9ede6; color: #273b35; font: 15px system-ui; }
  header { padding: 18px 28px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
  h1 { font-size: 22px; margin: 0; } p { margin: 4px 0; }
  label { display: flex; align-items: center; gap: 6px; }
  select, button { font: inherit; padding: 7px 10px; }
  canvas { display: block; width: 100%; height: 65vh; }
  footer { padding: 16px 28px; }
</style>
<header>
  <div><h1>Neighborhood scenery</h1><p>Production scenery · drag to orbit, scroll to zoom.</p></div>
  <label>Location <select id="location"><option value="town">Town homes</option><option value="park">Park pavilion</option><option value="mews">Mews market</option><option value="trees">Park trees</option><option value="streetTrees">Town street trees</option></select></label>
  <label>Lighting <select id="lighting"><option value="day">Day</option><option value="night">Night</option></select></label>
  <label>Detail <select id="detail"><option value="near">Near detail</option><option value="far">Distant silhouettes</option></select></label>
  <button id="check">Run visual checks</button>
</header>
<canvas id="review" aria-label="Orbit view of neighborhood buildings and branched trees"></canvas>
<footer><p id="status" role="status">Ready</p><p id="resources"></p><p>Building shells, roofs, trunks, branches and main crowns persist at distance. Facades and secondary foliage share the driving view's distance detail and retained buffers.</p><p><a href="/">Open free driving</a></p></footer>
<script type="module" src="./architecture-browser.mjs"></script>
</html>
